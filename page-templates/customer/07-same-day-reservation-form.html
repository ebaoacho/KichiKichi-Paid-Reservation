<style>
  .kkpay-customer-page {
    position: relative;
    left: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100vw;
    max-width: 100vw;
    margin-left: -50vw;
    box-sizing: border-box;
    padding-top: 160px;
    background: #f0eded;
  }

  .kkpay-customer-page__section {
    width: 100%;
    box-sizing: border-box;
    margin: 0 auto;
    text-align: left;
  }

  .kkpay-customer-page__section--calendar {
    max-width: 90vw;
    padding: 0;
  }

  .kkpay-customer-page__section--form {
    max-width: 780px;
    padding: 48px 24px;
  }

  .kkpay-customer-page__section--form > .kkpay-wrap {
    margin-left: auto;
    margin-right: auto;
  }

  .kkpay-customer-page--same-day-form.kkpay-customer-page--blocked .kkpay-customer-page__section--form {
    position: relative !important;
    left: 50% !important;
    display: flex !important;
    justify-content: center !important;
    width: 100vw !important;
    max-width: 100vw !important;
    margin-left: -50vw !important;
    margin-right: 0 !important;
    padding: 0 20px 72px !important;
    text-align: center !important;
  }

  .kkpay-customer-page--same-day-form.kkpay-customer-page--blocked #kkpay-same-day-form-wrap {
    width: min(780px, calc(100vw - 40px)) !important;
    max-width: min(780px, calc(100vw - 40px)) !important;
    margin: 0 auto !important;
  }

  .kkpay-customer-page--same-day-form.kkpay-customer-page--blocked #kkpay-same-day-blocked-graphic {
    width: min(780px, calc(100vw - 40px)) !important;
    max-width: min(780px, calc(100vw - 40px)) !important;
    margin: 0 auto !important;
    text-align: center !important;
  }

  .kkpay-customer-page--same-day-form.kkpay-customer-page--blocked #kkpay-same-day-blocked-image {
    display: block !important;
    width: 100% !important;
    max-width: min(780px, calc(100vw - 40px)) !important;
    height: auto !important;
    margin: 0 auto !important;
  }

  .kkpay-customer-page__section--calendar .kkpay-customer-calendar {
    margin-left: auto;
    margin-right: auto;
  }
</style>

<div class="kkpay-customer-page kkpay-customer-page--same-day-form">
  <div class="kkpay-customer-page__section kkpay-customer-page__section--calendar">
    [kkpay_customer_calendar]
  </div>

  <div class="kkpay-customer-page__section kkpay-customer-page__section--form">
    [kkpay_same_day_reservation_form]
  </div>
</div>
